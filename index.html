<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灌篮高手 · 只凝视着你</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://images.alphacoders.com/123/1234567.jpg') center/cover no-repeat;
            color: #fff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff6600;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .player {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 25px;
            margin: 0 auto;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
        }

        audio {
            width: 100%;
            margin: 20px 0;
        }

        .info {
            margin-top: 30px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .cherry {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 4rem;
            opacity: 0.3;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff6600; }
            to { text-shadow: 0 0 30px #ffcc00, 0 0 60px #ff8800; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="cherry">🌸</div>
    
    <div class="container">
        <h1>灌篮高手</h1>
        <p class="subtitle">只凝视着你 —— あなただけ見つめてる</p>
        
        <div class="player">
            <p style="margin: 10px 0 15px; font-size: 1.2rem; color: #ffcc00;">大黑摩季 · 灌篮高手 TV版片尾曲（1-24集）</p>
            
            <!-- 这里使用一个公开可用的YouTube音频代理或直接音频链接（推荐替换为更稳定的免费源） -->
            <audio id="audioPlayer" controls autoplay loop>
                <!-- 推荐使用以下稳定公开音频源（Bilibili/YouTube转音频常见方式） -->
                <!-- 如果浏览器拦截自动播放，请手动点击播放按钮 -->
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"> 
                <!-- 注意：上面是测试音频，请替换为真实的《只凝视着你》音频链接 -->
                您的浏览器不支持音频播放。
            </audio>
            
            <div style="margin-top: 15px; font-size: 0.95rem; color: #ddd;">
                🎵 打开网页即自动播放 · 循环播放
            </div>
        </div>

        <div class="info">
            <p>从相遇那天起<br>我只凝视着你</p>
            <p style="margin-top: 20px; font-size: 1rem; opacity: 0.85;">
                赤木晴子对流川枫的告白之歌<br>
                那个青春、热血、樱木花道与流川枫的时代……
            </p>
        </div>
    </div>

    <div class="footer">
        致所有曾为灌篮高手热血沸腾的我们 · 1993-2026
    </div>

    <script>
        // 自动播放尝试（部分浏览器需用户交互）
        const audio = document.getElementById('audioPlayer');
        
        // 尝试自动播放
        audio.play().catch(() => {
            console.log("自动播放被浏览器阻止，请手动点击播放");
        });

        // 页面点击任意位置也可触发播放（提升兼容性）
        document.addEventListener('click', () => {
            if (audio.paused) audio.play();
        }, { once: true });
    </script>
</body>
</html>
